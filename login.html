<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — SIKAMBA MABAR</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pass-wrap { position: relative; margin-bottom: 16px; }
    .pass-wrap .form-input { padding-right: 44px; margin-bottom: 0; }
    .pass-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text2); font-size: 18px; padding: 4px; display: flex; align-items: center; }
    .pass-toggle:hover { color: var(--brown); }
  </style>
</head>
<body>
  <div class="batik-strip"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div style="font-size:48px;margin-bottom:8px;">🏛️</div>
        <h2>SIKAMBA MABAR</h2>
        <p>Masuk ke akun Anda</p>
      </div>

      <div id="alertBox"></div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Masukkan email Anda">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="pass-wrap">
          <input type="password" id="password" class="form-input" placeholder="Masukkan password">
          <button class="pass-toggle" type="button" onclick="togglePass('password', this)" aria-label="Lihat password">👁️</button>
        </div>
      </div>
      <div style="text-align:right;margin-bottom:1.2rem;">
        <a href="lupa-password.html" style="font-size:13px;">Lupa password?</a>
      </div>

      <button class="btn btn-primary btn-full btn-lg" id="btnLogin" onclick="doLogin()">
        Masuk
      </button>

      <p style="text-align:center;margin-top:1.2rem;font-size:13px;color:var(--text2);">
        Belum punya akun? <a href="daftar.html"><strong>Daftar di sini</strong></a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Jika sudah login, langsung ke dashboard
    redirectIfLoggedIn();

    function togglePass(id, btn) {
      const el = document.getElementById(id);
      if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
      else { el.type = 'password'; btn.textContent = '👁️'; }
    }

    function showAlert(pesan, tipe = 'error') {
      document.getElementById('alertBox').innerHTML =
        `<div class="alert alert-${tipe}">${pesan}</div>`;
    }

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btnLogin');

      if (!email || !password) {
        showAlert('Email dan password wajib diisi.');
        return;
      }

      btn.textContent = 'Memproses...';
      btn.disabled = true;

      try {
        await login(email, password);
        showAlert('Login berhasil! Mengalihkan...', 'success');
        setTimeout(() => window.location.href = 'pages/dashboard.html', 1000);
      } catch(e) {
        showAlert('Email atau password salah. Coba lagi.');
        btn.textContent = 'Masuk';
        btn.disabled = false;
      }
    }

    // Bisa tekan Enter untuk login
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
