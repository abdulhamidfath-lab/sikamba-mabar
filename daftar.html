
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — SIKAMBA MABAR</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ✅ BARU: password toggle area sentuh lebih besar */
    .pass-wrap { position: relative; margin-bottom: 0; }
    .pass-wrap .form-input { padding-right: 52px; margin-bottom: 0; }
    .pass-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text2);
      font-size: 20px;
      padding: 8px;
      display: flex;
      align-items: center;
      min-width: 40px;
      min-height: 40px;
      justify-content: center;
    }
    .pass-toggle:hover { color: var(--brown); }

    /* ✅ BARU: pilihan peran lebih visual dan mudah disentuh di HP */
    .peran-pilihan {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.2rem;
    }
    .peran-option-card {
      border: 2px solid rgba(61,31,13,0.15);
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--cream);
      /* ✅ area sentuh cukup besar */
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .peran-option-card:hover { border-color: var(--gold); background: white; }
    .peran-option-card.selected { border-color: var(--brown); background: var(--cream2); }
    .peran-option-card .ikon { font-size: 26px; }
    .peran-option-card .label { font-size: 12px; font-weight: 700; color: var(--text); }
    .peran-option-card .desc { font-size: 11px; color: var(--text2); line-height: 1.4; }
    /* hidden select tetap ada untuk submit form */
    #peran { display: none; }

    @media (max-width: 480px) {
      .auth-card { border-radius: 16px; padding: 1.5rem 1.2rem; }
      /* form-row jadi 1 kolom di HP kecil */
      .form-row { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div class="batik-strip"></div>
  <div class="auth-page">
    <div class="auth-card" style="max-width:480px;">
      <div class="auth-logo">
        <div style="font-size:48px;margin-bottom:8px;">🏛️</div>
        <h2>Daftar Akun</h2>
        <p>Bergabung dengan SIKAMBA MABAR</p>
      </div>

      <div id="alertBox"></div>

      <!-- Nama & Peran -->
      <div class="form-group">
        <label class="form-label">Nama Lengkap *</label>
        <input type="text" id="nama" class="form-input"
          placeholder="Nama lengkap Anda"
          autocomplete="name">
      </div>

      <!-- ✅ BARU: pilihan peran pakai kartu visual, lebih mudah di HP -->
      <div class="form-group">
        <label class="form-label">Pilih Peran *</label>
        <div class="peran-pilihan">
          <div class="peran-option-card" id="cardIKM" onclick="pilihPeran('ikm')">
            <span class="ikon">🏭</span>
            <span class="label">Pelaku IKM</span>
            <span class="desc">Daftarkan usaha & jual produk</span>
          </div>
          <div class="peran-option-card" id="cardKonsumen" onclick="pilihPeran('konsumen')">
            <span class="ikon">🛍️</span>
            <span class="label">Konsumen</span>
            <span class="desc">Cari & beli produk lokal</span>
          </div>
        </div>
        <!-- select tersembunyi untuk nilai form -->
        <select id="peran">
          <option value="">-- Pilih Peran --</option>
          <option value="ikm">Pelaku IKM</option>
          <option value="konsumen">Konsumen</option>
        </select>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Email *</label>
        <input type="email" id="email" class="form-input"
          placeholder="Masukkan email aktif"
          autocomplete="email"
          inputmode="email">
      </div>

      <!-- Password -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <div class="pass-wrap">
            <input type="password" id="password" class="form-input"
              placeholder="Min. 6 karakter"
              autocomplete="new-password">
            <button class="pass-toggle" type="button"
              onclick="togglePass('password', this)"
              aria-label="Lihat password">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Konfirmasi Password *</label>
          <div class="pass-wrap">
            <input type="password" id="konfirmasi" class="form-input"
              placeholder="Ulangi password"
              autocomplete="new-password">
            <button class="pass-toggle" type="button"
              onclick="togglePass('konfirmasi', this)"
              aria-label="Lihat konfirmasi">👁️</button>
          </div>
        </div>
      </div>

      <button class="btn btn-primary btn-full btn-lg" id="btnDaftar" onclick="doDaftar()">
        Buat Akun
      </button>

      <p style="text-align:center;margin-top:1.2rem;font-size:13px;color:var(--text2);">
        Sudah punya akun? <a href="login.html"><strong>Masuk di sini</strong></a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function showAlert(pesan, tipe = 'error') {
      document.getElementById('alertBox').innerHTML =
        `<div class="alert alert-${tipe}">${pesan}</div>`;
    }

    function togglePass(id, btn) {
      const el = document.getElementById(id);
      if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
      else { el.type = 'password'; btn.textContent = '👁️'; }
    }

    // ✅ BARU: fungsi pilih peran pakai kartu visual
    function pilihPeran(nilai) {
      document.getElementById('peran').value = nilai;
      document.getElementById('cardIKM').classList.toggle('selected', nilai === 'ikm');
      document.getElementById('cardKonsumen').classList.toggle('selected', nilai === 'konsumen');
    }

    async function doDaftar() {
      const nama      = document.getElementById('nama').value.trim();
      const peran     = document.getElementById('peran').value;
      const email     = document.getElementById('email').value.trim();
      const password  = document.getElementById('password').value;
      const konfirmasi = document.getElementById('konfirmasi').value;
      const btn       = document.getElementById('btnDaftar');

      if (!nama || !peran || !email || !password) {
        showAlert('Semua kolom wajib diisi.'); return;
      }
      if (password.length < 6) {
        showAlert('Password minimal 6 karakter.'); return;
      }
      if (password !== konfirmasi) {
        showAlert('Konfirmasi password tidak cocok.'); return;
      }

      btn.textContent = 'Memproses...';
      btn.disabled = true;

      try {
        await daftar(email, password, nama, peran);
        showAlert('Akun berhasil dibuat! Silakan cek email untuk verifikasi.', 'success');
        setTimeout(() => window.location.href = 'login.html', 3000);
      } catch(e) {
        showAlert('Gagal membuat akun: ' + e.message);
        btn.textContent = 'Buat Akun';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
