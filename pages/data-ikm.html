<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data IKM — SIKAMBA MABAR</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .filter-bar { background:white; border-radius:var(--radius-lg); padding:1rem 1.2rem; margin-bottom:1.2rem; box-shadow:var(--shadow); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .search-input { flex:1; min-width:200px; border:1.5px solid rgba(61,31,13,0.15); border-radius:var(--radius); padding:9px 14px; font-size:14px; font-family:'Plus Jakarta Sans',sans-serif; background:var(--cream); outline:none; }
    .search-input:focus { border-color:var(--gold); }

    .ikm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; }
    .ikm-card { background:white; border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow); border:1px solid rgba(61,31,13,0.07); transition:transform 0.2s,box-shadow 0.2s; }
    .ikm-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
    .ikm-foto { height:140px; background:linear-gradient(135deg,var(--brown),var(--gold)); display:flex; align-items:center; justify-content:center; font-size:48px; overflow:hidden; }
    .ikm-foto img { width:100%; height:100%; object-fit:cover; }
    .ikm-body { padding:1rem; }
    .ikm-nama { font-family:'Playfair Display',serif; font-size:1rem; font-weight:700; color:var(--brown); margin-bottom:4px; }
    .ikm-pemilik { font-size:12px; color:var(--text2); margin-bottom:8px; }
    .ikm-meta { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .ikm-lokasi { font-size:12px; color:var(--text2); }
    .empty-state { text-align:center; padding:4rem 2rem; color:var(--text2); }
    .empty-state div { font-size:48px; margin-bottom:1rem; }

    /* ✅ BARU: tombol aksi card — jadi full-width di HP */
    .ikm-actions { display:flex; gap:8px; margin-top:12px; }
    .ikm-actions .btn { flex:1; font-size:12px; padding:8px 10px; min-height:40px; }
    /* Tombol hapus tidak ikut flex:1 agar tidak terlalu lebar */
    .ikm-actions .btn-hapus { flex:0 0 auto; padding:8px 12px; }

    /* ✅ BARU: grid 1 kolom di HP agar kartu tidak terlalu sempit */
    @media (max-width: 640px) {
      .ikm-grid { grid-template-columns: 1fr; }
      .ikm-foto { height: 160px; }
      /* filter jadi vertikal di HP */
      .filter-bar { flex-direction: column; align-items: stretch; }
      .search-input { min-width: unset; font-size: 16px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-brand" style="text-decoration:none;">🏛️ <span>SIKAMBA MABAR</span></a>
    <form class="navbar-search" onsubmit="goSearch(event)">
      <input type="text" class="navbar-search-input" placeholder="🔍  Cari IKM atau produk..." id="navSearch">
      <button type="submit" class="navbar-search-btn">Cari</button>
    </form>
    <script>
      function goSearch(e) {
        e.preventDefault();
        const q = document.getElementById('navSearch').value.trim();
        if (q) window.location.href = '../pages/cari.html?q=' + encodeURIComponent(q);
      }
    </script>
    <button class="navbar-toggle" onclick="toggleMenu()">☰</button>
    <div class="navbar-menu" id="navMenu">
      <a href="dashboard.html">Dashboard</a>
      <a href="data-ikm.html" class="active">Data IKM</a>
      <a href="peta.html">Peta Industri</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="laporan.html" id="navLaporan" style="display:none;">Laporan</a>
      <a href="manajemen-pengguna.html" id="navPengguna" style="display:none;">Pengguna</a>
      <a href="profil.html">Profil Saya</a>
      <a href="#" onclick="logout()">Keluar</a>
    </div>
  </nav>
  <div class="batik-strip"></div>

  <!-- ✅ BARU: Search bar khusus HP -->
  <div class="mobile-search-bar">
    <form onsubmit="goMobileSearch(event)">
      <input type="text" id="mobileSearchInput" placeholder="🔍 Cari IKM atau produk...">
      <button type="submit">Cari</button>
    </form>
  </div>

  <div class="container" style="padding-top:2rem;padding-bottom:3rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px;">
      <h2 style="margin:0;">📊 Data IKM Manggarai Barat</h2>
      <div id="tombolTambah"></div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Cari nama usaha, pemilik, atau desa...">
      <!-- ✅ BARU: filter select dalam baris sendiri agar rapi di HP -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;width:100%;">
        <select class="form-select" id="filterKategori" style="flex:1;min-width:140px;margin-bottom:0;">
          <option value="">Semua Kategori</option>
          <option value="Anyaman & Kerajinan">Anyaman & Kerajinan</option>
          <option value="Tenun Tradisional">Tenun Tradisional</option>
          <option value="Makanan & Minuman">Makanan & Minuman</option>
          <option value="Kopi & Minuman Herbal">Kopi & Minuman Herbal</option>
          <option value="Fashion & Konveksi">Fashion & Konveksi</option>
          <option value="Furniture & Kayu">Furniture & Kayu</option>
          <option value="Perbengkelan">Perbengkelan</option>
          <option value="Jasa & Lainnya">Jasa & Lainnya</option>
        </select>
        <select class="form-select" id="filterKecamatan" style="flex:1;min-width:140px;margin-bottom:0;">
          <option value="">Semua Kecamatan</option>
          <option value="Komodo">Komodo</option>
          <option value="Boleng">Boleng</option>
          <option value="Sano Nggoang">Sano Nggoang</option>
          <option value="Mbeliling">Mbeliling</option>
          <option value="Lembor">Lembor</option>
          <option value="Lembor Selatan">Lembor Selatan</option>
          <option value="Welak">Welak</option>
          <option value="Kuwus">Kuwus</option>
          <option value="Kuwus Barat">Kuwus Barat</option>
          <option value="Pacar">Pacar</option>
          <option value="Mancang Pacar">Mancang Pacar</option>
          <option value="Ndoso">Ndoso</option>
        </select>
      </div>
    </div>

    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;">
      Menampilkan <strong id="jumlahTampil">0</strong> IKM
    </p>

    <div class="ikm-grid" id="ikmGrid">
      <div style="grid-column:1/-1;text-align:center;padding:3rem;">
        <div class="spinner"></div>
        <p style="color:var(--text2);margin-top:1rem;">Memuat data IKM...</p>
      </div>
    </div>
  </div>

  <footer>
    <strong>SIKAMBA MABAR</strong> — Dinas Perdagangan dan Perindustrian Kabupaten Manggarai Barat © 2024
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ikm.js"></script>
  <script>
    function toggleMenu() { document.getElementById('navMenu').classList.toggle('open'); }
    function goMobileSearch(e) {
      e.preventDefault();
      const q = document.getElementById('mobileSearchInput').value.trim();
      if (q) window.location.href = 'cari.html?q=' + encodeURIComponent(q);
    }

    const ikonKategori = {
      'Anyaman & Kerajinan': '🧺',
      'Tenun Tradisional': '🧵',
      'Makanan & Minuman': '🍽️',
      'Kopi & Minuman Herbal': '☕',
      'Fashion & Konveksi': '👗',
      'Furniture & Kayu': '🪵',
      'Perbengkelan': '🔧',
      'Jasa & Lainnya': '🏢'
    };

    let semuaIKM = [];
    let peranUser = 'konsumen';
    let ikmIdUser = null;

    function bisaEdit(ikm) {
      if (peranUser === 'admin') return true;
      if (peranUser === 'ikm' && ikmIdUser === ikm.id) return true;
      return false;
    }

    function renderIKM(list) {
      const grid = document.getElementById('ikmGrid');
      document.getElementById('jumlahTampil').textContent = list.length;
      if (list.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
          <div>🏭</div>
          <p>Tidak ada IKM yang ditemukan.</p>
          <a href="form-ikm.html" class="btn btn-primary" style="margin-top:1rem;">Tambah IKM Pertama</a>
        </div>`;
        return;
      }
      grid.innerHTML = list.map(ikm => `
        <div class="ikm-card">
          <div class="ikm-foto">
            ${ikm.foto_url
              ? `<img src="${ikm.foto_url}" alt="${ikm.nama_usaha}">`
              : `<span>${ikonKategori[ikm.kategori] || '🏭'}</span>`}
          </div>
          <div class="ikm-body">
            <div class="ikm-nama">${ikm.nama_usaha}</div>
            <div class="ikm-pemilik">👤 ${ikm.pemilik}</div>
            <div class="ikm-meta">
              <span class="badge badge-kategori">${ikm.kategori}</span>
              <span class="badge badge-${ikm.status === 'aktif' ? 'aktif' : ikm.status === 'menunggu' ? 'menunggu' : 'nonaktif'}">${ikm.status}</span>
            </div>
            <div class="ikm-lokasi">📍 ${[ikm.desa, ikm.kecamatan].filter(Boolean).join(', ') || '-'}</div>
            ${ikm.no_telp ? `<div class="ikm-lokasi" style="margin-top:4px;">📞 ${ikm.no_telp}</div>` : ''}
            <!-- ✅ BARU: tombol pakai class ikm-actions agar responsive -->
            <div class="ikm-actions">
              <a href="detail-ikm.html?id=${ikm.id}" class="btn btn-secondary">Lihat Detail</a>
              ${bisaEdit(ikm) ? `<a href="form-ikm.html?id=${ikm.id}" class="btn btn-gold">✏️ Edit</a>` : ''}
              ${peranUser === 'admin' ? `<button class="btn btn-danger btn-hapus" onclick="hapusIKM('${ikm.id}','${ikm.nama_usaha.replace(/'/g,"\\'")}')">🗑️</button>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function filter() {
      const cari = document.getElementById('searchInput').value.toLowerCase();
      const kat  = document.getElementById('filterKategori').value;
      const kec  = document.getElementById('filterKecamatan').value;
      const hasil = semuaIKM.filter(ikm => {
        const cocokCari = !cari ||
          ikm.nama_usaha?.toLowerCase().includes(cari) ||
          ikm.pemilik?.toLowerCase().includes(cari) ||
          ikm.desa?.toLowerCase().includes(cari);
        const cocokKat = !kat || ikm.kategori === kat;
        const cocokKec = !kec || ikm.kecamatan === kec;
        return cocokCari && cocokKat && cocokKec;
      });
      renderIKM(hasil);
    }

    document.getElementById('searchInput').addEventListener('input', filter);
    document.getElementById('filterKategori').addEventListener('change', filter);
    document.getElementById('filterKecamatan').addEventListener('change', filter);

    async function init() {
      try {
        const user = await getUser();
        if (user) {
          const profil = await getProfil(user.id);
          peranUser = profil?.peran || 'konsumen';
          ikmIdUser = profil?.ikm_id || null;
        }
      } catch(e) {}

      if (peranUser === 'admin' || peranUser === 'ikm') {
        document.getElementById('tombolTambah').innerHTML =
          '<a href="form-ikm.html" class="btn btn-primary">➕ Tambah IKM</a>';
      }

      try {
        const { data, error } = await db.from('ikm').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        semuaIKM = data || [];
        renderIKM(semuaIKM);
      } catch(e) {
        document.getElementById('ikmGrid').innerHTML =
          `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--red);">Gagal memuat data: ${e.message}</div>`;
      }
    }

    async function hapusIKM(id, nama) {
      const konfirmasi = confirm(`⚠️ Hapus IKM "${nama}"?\n\nTindakan ini TIDAK bisa dibatalkan.`);
      if (!konfirmasi) return;
      try {
        const { error } = await db.from('ikm').delete().eq('id', id);
        if (error) throw error;
        semuaIKM = semuaIKM.filter(i => i.id !== id);
        filter();
        alert('✅ Data IKM berhasil dihapus.');
      } catch(e) {
        alert('Gagal menghapus: ' + e.message);
      }
    }

    init();
  </script>

  <script>
    (async function tampilkanNavAdmin() {
      try {
        const user = await getUser();
        if (!user) return;
        const profil = await getProfil(user.id);
        if (profil?.peran === 'admin') {
          const nl = document.getElementById('navLaporan');
          const np = document.getElementById('navPengguna');
          if (nl) nl.style.display = 'block';
          if (np) np.style.display = 'block';
        }
      } catch(e) {}
    })();
  </script>

  <script src="../js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initAdminSidebar === 'function') initAdminSidebar('data-ikm');
    });
  </script>
</body>
</html>
