<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Produk — SIKAMBA MABAR</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .verify-page { min-height:100vh; background:linear-gradient(160deg,var(--brown) 0%,var(--brown-mid) 50%,var(--cream) 100%); display:flex; align-items:center; justify-content:center; padding:2rem; }
    .verify-card { background:white; border-radius:20px; padding:2rem; width:100%; max-width:420px; box-shadow:0 8px 40px rgba(0,0,0,0.2); }
    .badge-asli { background:var(--green-light); color:var(--green); padding:10px 20px; border-radius:20px; font-size:14px; font-weight:700; display:inline-block; margin-bottom:1rem; }
    .info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--cream2); font-size:13px; }
    .info-row:last-child { border-bottom:none; }
  </style>
</head>
<body>
  <div class="batik-strip"></div>
  <div class="verify-page">
    <div class="verify-card" id="cardOK" style="display:none;">
      <div style="text-align:center;margin-bottom:1.5rem;">
        <div style="font-size:56px;margin-bottom:8px;">✅</div>
        <span class="badge-asli">Produk Asli Manggarai Barat</span>
        <h2 id="namaProduk" style="margin-bottom:4px;"></h2>
        <p style="font-size:13px;color:var(--text2);" id="namaIKM"></p>
      </div>

      <div id="infoProduk" style="margin-bottom:1.5rem;"></div>

      <div id="fotoWrap" style="text-align:center;margin-bottom:1.5rem;display:none;">
        <img id="fotoProduk" src="" alt="Foto produk" style="max-width:100%;border-radius:var(--radius-lg);max-height:200px;object-fit:cover;">
      </div>

      <a href="#" id="linkDetail" class="btn btn-primary btn-full" style="margin-bottom:10px;">Lihat Detail Produk</a>
      <a href="#" id="linkIKM" class="btn btn-secondary btn-full" style="margin-bottom:10px;">Lihat Profil IKM</a>
      <a id="btnWA" href="#" class="btn btn-full" style="background:#25D366;color:white;display:none;">💬 Hubungi via WhatsApp</a>
    </div>

    <div class="verify-card" id="cardError" style="display:none;text-align:center;">
      <div style="font-size:56px;margin-bottom:1rem;">❌</div>
      <h2>Produk Tidak Ditemukan</h2>
      <p style="color:var(--text2);font-size:14px;margin:0.8rem 0 1.5rem;">QR code ini tidak valid atau produk sudah tidak terdaftar.</p>
      <a href="marketplace.html" class="btn btn-primary btn-full">Ke Marketplace</a>
    </div>

    <div id="cardLoading" style="text-align:center;color:white;">
      <div class="spinner" style="border-top-color:white;"></div>
      <p style="margin-top:1rem;">Memverifikasi produk...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script>
    function rupiah(n) { return 'Rp ' + parseInt(n).toLocaleString('id-ID'); }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        document.getElementById('cardLoading').style.display = 'none';
        document.getElementById('cardError').style.display = 'block';
        return;
      }

      const { data: p, error } = await db
        .from('produk')
        .select('*, ikm:ikm_id(*)')
        .eq('id', id)
        .single();

      document.getElementById('cardLoading').style.display = 'none';

      if (error || !p || !p.aktif) {
        document.getElementById('cardError').style.display = 'block';
        return;
      }

      document.getElementById('cardOK').style.display = 'block';
      document.getElementById('namaProduk').textContent = p.nama_produk;
      document.getElementById('namaIKM').textContent = '🏭 ' + (p.ikm?.nama_usaha || '-');

      document.getElementById('infoProduk').innerHTML = `
        <div class="info-row"><span style="color:var(--text2);">Kategori</span><span style="font-weight:600;">${p.kategori}</span></div>
        <div class="info-row"><span style="color:var(--text2);">Harga</span><span style="font-weight:700;color:var(--brown);">${rupiah(p.harga)}</span></div>
        <div class="info-row"><span style="color:var(--text2);">Bahan Baku</span><span style="font-weight:600;">${p.bahan_baku || '-'}</span></div>
        <div class="info-row"><span style="color:var(--text2);">Asal IKM</span><span style="font-weight:600;">${[p.ikm?.desa, p.ikm?.kecamatan].filter(Boolean).join(', ') || '-'}</span></div>
      `;

      if (p.foto_url) {
        document.getElementById('fotoWrap').style.display = 'block';
        document.getElementById('fotoProduk').src = p.foto_url;
      }

      document.getElementById('linkDetail').href = `detail-produk.html?id=${p.id}`;
      document.getElementById('linkIKM').href = `detail-ikm.html?id=${p.ikm_id}`;

      if (p.ikm?.no_telp) {
        const noWA = '62' + p.ikm.no_telp.replace(/^0/, '');
        const pesan = encodeURIComponent(`Halo, saya ingin membeli *${p.nama_produk}* dari ${p.ikm.nama_usaha}.`);
        const btnWA = document.getElementById('btnWA');
        btnWA.style.display = 'flex';
        btnWA.href = `https://wa.me/${noWA}?text=${pesan}`;
      }
    }

    init();
  </script>
</body>
</html>
